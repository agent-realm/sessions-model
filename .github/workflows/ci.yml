name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # By hand (Actions, CI, Run workflow): the guard over the whole history. Run it whenever the
  # guard's rules tighten (AGENTS.md, Checks).
  workflow_dispatch:

permissions:
  contents: read

env:
  # The provider whose seal() and validateSession() the examples and the tutorial are checked
  # against: harness-skeleton's packages/harness-session-adapters, pinned. Move the pin by PR.
  HARNESS_SKELETON_REF: 893fa1cfbbf0e77aeedb7dea421d7880c59e0f58

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test the guard
        run: node scripts/guard.mjs --self-test
      - name: Guard the tracked files and the commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The checkout is the merge commit: HEAD^1 is the base, HEAD^2 the pull request's head.
            # The base's copy of the guard runs, so a change to the guard takes effect only after
            # it is merged. Changes to this workflow itself still need review.
            if git cat-file -e "HEAD^1:scripts/guard.mjs" 2>/dev/null; then
              git show "HEAD^1:scripts/guard.mjs" > "$RUNNER_TEMP/guard.mjs"
              guard="$RUNNER_TEMP/guard.mjs"
            else
              guard=scripts/guard.mjs
            fi
            node "$guard" --commits "HEAD^1..HEAD^2"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/guard.mjs --commits HEAD
          else
            # A push scans the commits it brings. Earlier history was scanned when it came in, so a
            # stricter guard does not fail main on lines it already carries. A new branch, or a
            # before-commit this clone lacks, scans the whole history.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              node scripts/guard.mjs --commits "$BEFORE..HEAD"
            else
              node scripts/guard.mjs --commits HEAD
            fi
          fi

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: agent-realm/harness-skeleton
          ref: ${{ env.HARNESS_SKELETON_REF }}
          path: .provider/harness-skeleton
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate and validate the examples
        run: |
          node examples/generate.mjs "$GITHUB_WORKSPACE/.provider/harness-skeleton/packages/harness-session-adapters" examples
          git status --porcelain -- examples
          test -z "$(git status --porcelain -- examples)"
      - name: Run the tutorial
        run: node scripts/check-tutorial.mjs "$GITHUB_WORKSPACE/.provider/harness-skeleton"
